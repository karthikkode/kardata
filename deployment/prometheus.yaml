global:
  scrape_interval: 15s

rule_files:
  - '/etc/prometheus/rules.yaml'

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  # Backend RED metrics and the existing worker's activated SDK telemetry.
  - job_name: backend
    static_configs:
      - targets: ['backend:3001']
  - job_name: temporal-worker
    static_configs:
      - targets: ['worker:9464']
