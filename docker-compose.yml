services:
  db:
    image: postgres:16
    ports:
      # Loopback-only: agent containers reach the host through the bridge
      # gateway, where nothing must listen on Postgres (Stage 3b Step 0 AC2).
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kardata
    volumes:
      - kardata_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro

volumes:
  kardata_pgdata:
