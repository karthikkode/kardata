                independent: { type: boolean, const: true }
              additionalProperties: false
      responses:
        "200":
          description: Owner-reviewed private context replacement.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    $ref: "#/components/schemas/LocalContext"
                additionalProperties: false
        "403":
          description: Approver role required.
        "409":
          description: Active lease, stale version or unresolved source-dependent operations.
  /v1/threads/{threadKey}/context/compact:
    post:
      operationId: compactLocalContext
      tags:
        - sectors
      parameters:
        - name: threadKey
          in: path
          required: true
          schema: *a0
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Workspace response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - data
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/CompactionResult"
                additionalProperties: false
        "403":
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Version conflict or action unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/sectors/{sectorId}/files/{fileId}/units:
    get:
      operationId: getSectorFileUnits
      tags: [files]
      summary: Scoped indexed sections; processing files expose no staged content.
      parameters:
        - $ref: '#/components/parameters/SectorId'
        - name: fileId
          in: path
          required: true
          schema: { type: string }
        - name: fromOrd
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Ordinals at or after fromOrd; nextOrd starts the next page.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/FileUnitsPage' }
        '403': { description: Missing credentials or hidden file. }
        '404': { description: File outside scope or unknown. }
        '503': { description: Projection or database unavailable. }
  /v1/sectors/{sectorId}/files/{fileId}/retry:
    post:
      operationId: retryFileProcessing
      tags: [files]
      summary: Approver retry of a retained PDF job with exact revision and paid-outcome acknowledgement.
      parameters:
        - $ref: '#/components/parameters/SectorId'
        - name: fileId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jobId, revision]
              properties:
                jobId: { type: string }
                revision: { type: integer, minimum: 0 }
                allowDuplicatePaid: { type: boolean, default: false }
      responses:
        '200':
          description: Retained file job queued at the new revision.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/FileProcessingProgress' }
        '403': { description: Validated approver key required. }
        '404': { description: File/job outside scope or unknown. }
        '409': { description: Hidden file, stale revision or paid outcome requiring explicit acknowledgement. }
        '503': { description: Existing file worker unavailable. }
  /v1/sectors/{sectorId}/files/{fileId}/body:
    get:
      operationId: getSectorFileBody
      summary: Read a visible sector file with retained original bytes and extracted text
      parameters:
        - name: sectorId
          in: path
          required: true
          schema: { type: string }
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Scoped file preview
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/SectorFileBody' }
        '403':
          description: Access denied or file hidden
        '404':
          description: File or sector not visible
        '409':
          description: File not indexed
        '500':
          description: Stored file failed its integrity check

  /v1/threads/{threadKey}/execution-records:
    get:
      operationId: listExecutionRecords
      tags: [threads]
      summary: Approver-only scoped metadata for normalized adapter execution records.
      description: Requires a registered approver key even in local open mode. No MCP counterpart. Archive keys and content are omitted from this list.
      parameters:
        - $ref: '#/components/parameters/ThreadKey'
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
        - name: afterSeq
          in: query
          schema: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Scoped chronological metadata page.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ExecutionRecordPage' }
                additionalProperties: false
        '400': { description: Invalid pagination. }
        '403': { description: Registered approver key required. }
        '404': { description: Conversation outside caller scope or deleted. }
  /v1/threads/{threadKey}/execution-records/{seq}:
    get:
      operationId: getExecutionRecord
      tags: [threads]
      summary: Approver-only verified normalized adapter snapshot.
      description: The scoped journal supplies the archive reference. Session, hash and exact byte size are verified. Historical snapshots may contain content seen before a file was hidden. Shared plan observed identifies shared-reference metadata, not the coordinator's assignment version.
      parameters:
        - $ref: '#/components/parameters/ThreadKey'
        - name: seq
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Verified JSON object containing a normalized adapter input/result or tool boundary.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ExecutionRecordBody' }
                additionalProperties: false
        '400': { description: Invalid sequence. }
        '403': { description: Registered approver key required. }
        '404': { description: Journal record outside this conversation. }
        '409': { description: Missing, corrupt or invalid stored snapshot. }
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    SectorId:
      name: sectorId
      in: path
      required: true
      schema:
        type: string
    ThreadKey:
      name: threadKey
      in: path
      required: true
      description: Session id for the session thread, `agent:<child-id>` for subagents.
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Duplicate authorized mutation with unchanged semantic input replays its outcome. Uncertain operations conflict until reconciled; MCP reads are fresh.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    NotFound:
      description: Unknown id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            ok: false
            error: { code: not_found, message: 'no such session' }
    Denied:
      description: Call lacks the required role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            ok: false
            error: { code: permission_denied, message: 'approve role required' }
    IdempotencyReplay:
      description: Operation key conflicts with different semantic input/authority or an unresolved guarded operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SupervisionAlert:
      type: object
      additionalProperties: false
      required: [seq, at, kind, severity, subject, threadKey, sectorId, sessionId, resolvedAt, state]
      properties:
        seq: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        kind: { type: string }
        severity: { type: string, enum: [info, warning, high, critical] }
        subject: { type: string }
        threadKey: { type: [string, 'null'] }
        sectorId: { type: [string, 'null'] }
        sessionId: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        state: { type: string, enum: [current-warning, historical] }
    SupervisionAlertPage:
      type: object
      additionalProperties: false
      required: [items, nextBeforeSeq]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SupervisionAlert' }
        nextBeforeSeq: { type: [integer, 'null'], minimum: 1 }
    SupervisionAlertEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/SupervisionAlertPage' }
    McpRequest:
      type: object
      description: JSON-RPC request for POST /mcp (initialize, tools/list, tools/call).
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
        id:
          type: [string, integer]
        method:
          type: string
        params:
          type: object
    McpResponse:
      type: object
      description: JSON-RPC response (result or error, never both).
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
        id:
          type: [string, integer]
        result:
          type: object
        error:
          $ref: '#/components/schemas/McpError'
    McpError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
    Session:
      type: object
      description: Counterpart of MockSession; `age` stays a client-side format of timestamps.
      required: [id, title, createdAt, updatedAt]
      properties:
        kind:
          type: string
          enum: [research, normal]
        id:
          type: string
        title:
          type: string
        sectorId:
          type: string
          description: Owning sector for sector chats; absent for general sessions.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        model:
          $ref: '#/components/schemas/SessionModel'
    SessionModel:
      type: object
      description: Per-session provider+model selection; absent until PATCH sets one.
      required: [provider, model, reasoning]
      properties:
        provider:
          type: string
          enum: [meta]
        model:
          type: string
        reasoning:
          type: boolean
        effort:
          type: string
          description: Reasoning depth; only meaningful when the model lists the level.
      example:
        provider: meta
        model: muse-spark-1.3-contributor
        reasoning: true
        effort: high
    SessionModelEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SessionModel'
    ProviderCatalog:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
          required: [defaultProvider, providers]
          properties:
            defaultProvider:
              type: string
              enum: [meta]
            providers:
              type: array
              items:
                $ref: '#/components/schemas/ProviderEntry'
    ProviderEntry:
      type: object
      required: [name, hasKey, defaultModel, models]
      properties:
        name:
          type: string
          enum: [meta]
        hasKey:
          type: boolean
          description: Key presence only; key material never leaves the server.
        defaultModel:
          type: string
          description: Configured Meta default, muse-spark-1.3-contributor when unset.
        models:
          type: array
          items:
            $ref: '#/components/schemas/ProviderModel'
    ProviderModel:
      type: object
      required: [provider, model, displayName, reasoning, efforts]
      properties:
        provider:
          type: string
          enum: [meta]
        model:
          type: string
        displayName:
          type: string
        reasoning:
          type: string
          enum: [native, none]
        mode:
          type: string
          enum: [chat, responses]
        efforts:
          type: array
          items:
            type: string
          description: Selectable reasoning depths (live-verified per model); empty means no depth control.
      example:
        provider: meta
        model: muse-spark-1.3-contributor
        displayName: muse-spark-1.3-contributor
        reasoning: native
        mode: responses
        efforts: [minimal, low, medium, high, xhigh]
    SessionEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Session'
    ArtifactSummary:
      type: object
      description: Counterpart of MockFile; `id` renders from artifactId, `source` from kind.
      required: [artifactId, indexed]
      properties:
        artifactId:
          type: string
        name:
          type: string
        kind:
          type: string
        bytes:
          type: integer
        reason:
          type: string
        producedBy:
          type: string
        referencedFrom:
          type: object
        sessionId:
          type: string
        sha256:
          type: string
        detail:
          type: string
        indexed:
          type: boolean
    ArtifactList:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactSummary'
    ArtifactEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ArtifactSummary'
    ArtifactBody:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
          required: [body, meta]
          properties:
            body:
              type: string
            meta:
              type: object
    ResearchState:
      type: string
      enum: [planning, planned, approved, running, paused, queued, failed, complete]
    SectorResearch:
      type: object
      description: Counterpart of MockSectorResearch; `companiesFound` is computed, never stored.
      required: [id, name, topic, companiesFound, state]
      properties:
        id:
          type: string
        name:
          type: string
        topic:
          type: string
        companiesFound:
          type: integer
        state:
          $ref: '#/components/schemas/ResearchState'
        researchSessionId:
          type: string
          nullable: true
          description: Chat session that started the research (pinned); null until recorded.
      example:
        id: sec-pet-care
        name: Pet care
        topic: D2C pet brands
        companiesFound: 2
        state: running
        researchSessionId: null
    SectorList:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SectorResearch'
    PlanVersion:
      type: object
      required: [version, markdown, at]
      properties:
        executable:
          $ref: '#/components/schemas/ExecutablePlan'
        version:
          type: integer
          minimum: 1
        markdown:
          type: string
        at:
          type: string
          format: date-time
    SectorPlan:
      type: object
      required: [sectorId, versions, latest]
      properties:
        approvedContext:
          type: object
          required: [version, scope]
          properties:
            version:
              type: integer
              minimum: 0
            scope:
              type: string
            decisions:
              type: string
          additionalProperties: false
        sectorId:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PlanVersion'
        latest:
          type: object
          nullable: true
          description: Newest version, or null before the first plan lands.
        approvals:
          type: array
          items:
            type: integer
          description: Pinned versions in approval order.
        approvedVersion:
          type: integer
          nullable: true
          description: Last pinned version, or null before approval.
    CompanyResearch:
      type: object
      description: Counterpart of MockCompanyResearch; `name` renders from company, `sectorName` from sector.
      required: [id, sectorId, sectorName, name, stage, state]
      properties:
        id:
          type: string
        sectorId:
          type: string
        sectorName:
          type: string
        name:
          type: string
        stage:
          type: string
          enum: [Filter, Deep research, Problem found, Final validation]
        state:
          $ref: '#/components/schemas/ResearchState'
    CompanyList:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
          required: [companies, total]
          properties:
            companies:
              type: array
              items:
                $ref: '#/components/schemas/CompanyResearch'
            total:
              type: integer
              minimum: 0
    SectorActivityEntry:
      type: object
      required: [seq, text]
      properties:
        seq:
          type: integer
        text:
          type: string
    SectorDetail:
      type: object
      description: Sector plus its companies and server-derived activity timeline.
      required: [id, name, topic, companiesFound, state, companies, companiesTotal, activity, activityTotal]
      properties:
        id:
          type: string
        name:
          type: string
        topic:
          type: string
        companiesFound:
          type: integer
        state:
          $ref: '#/components/schemas/ResearchState'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanyResearch'
        companiesTotal:
          type: integer
          minimum: 0
        activity:
          type: array
          items:
            $ref: '#/components/schemas/SectorActivityEntry'
        activityTotal:
          type: integer
          minimum: 0
    SectorEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SectorDetail'
    SessionList:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    Thread:
      type: object
      required: [key, sessionId, kind, status, acceptingSteer, queueDepth, updatedAt]
      properties:
        key:
          type: string
        sessionId:
          type: string
        kind:
          type: string
          enum: [session, subagent]
        status:
          $ref: '#/components/schemas/RunState'
        acceptingSteer:
          type: boolean
        queueDepth:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
      example:
        key: 'agent:a2'
        sessionId: s-now
        kind: subagent
        status: RUNNING
        acceptingSteer: true
        queueDepth: 1
        updatedAt: '2026-09-25T10:00:00Z'
    ThreadEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Thread'
    ThreadList:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Thread'
    RunState:
      type: string
      description: |
        Agents loop states plus SUSPENDED (A11.4 time-budget breach).
        Mock AgentStatus maps: running -> RUNNING, done -> FINISHED,
        failed -> ERROR, stopped -> CANCELLING then FINISHED.
      enum: [IDLE, RUNNING, PAUSED, SUSPENDED, CANCELLING, FINISHED, ERROR]
    ThreadMessage:
      type: object
      description: Counterpart of ChatPanel ChatMessage (text | tool | approval).
      required: [seq, kind, at]
      properties:
        seq:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [text, tool, approval]
        at:
          type: string
          format: date-time
        role:
          type: string
          enum: [user, agent]
        text:
          type: string
        reasoning:
          type: string
          description: Provider thinking trace on agent replies; absent otherwise.
        failed:
          type: boolean
        streaming:
          type: boolean
        queued:
          type: boolean
        name:
          type: string
        detail:
          type: string
        state:
          type: string
          enum: [running, done, failed]
        action:
          type: string
          enum: [pause, resume, send]
        title:
          type: string
        decision:
          type: string
          enum: [pending, approved, denied]
      example:
        seq: 7
        kind: approval
        at: '2026-09-25T10:01:00Z'
        action: send
        title: 'Send shortlist to owner'
        detail: 'Writes to the shared index.'
        decision: pending
    MessagePage:
      type: object
      required: [ok, data, nextAfterSeq]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ThreadMessage'
        nextAfterSeq:
          type: integer
          description: Pass as afterSeq for the next page; also the SSE resume token.
    Run:
      type: object
      required: [id, sessionId, threadKey, state, budgetUsedRatio, contextUsedRatio, updatedAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
        threadKey:
          type: string
        state:
          $ref: '#/components/schemas/RunState'
        stageCursor:
          type: string
          description: Research checkpoint cursor; absent for non-research runs.
        budgetUsedRatio:
          type: number
          minimum: 0
        contextUsedRatio:
          type: number
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    RunEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Run'
    RunList:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Run'
    SendCommand:
      type: object
      required: [threadKey, text]
      properties:
        threadKey:
          type: string
        text:
          type: string
          minLength: 1
    SteerCommand:
      type: object
      required: [threadKey, text]
      properties:
        threadKey:
          type: string
        text:
          type: string
          minLength: 1
    RunRef:
      type: object
      required: [runId]
      properties:
        runId:
          type: string
    ResumeCommand:
      type: object
      required: [runId]
      properties:
        runId:
          type: string
        extendedBudgetMs:
          type: integer
          minimum: 1
          description: Operator-approved extra wall-clock; absent means no extension.
    ApprovalDecision:
      type: object
      required: [approvalId, decision]
      properties:
        approvalId:
          type: string
        decision:
          type: string
          enum: [approved, denied]
    CommandEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
          required: [commandId, state]
          properties:
            commandId:
              type: string
            state:
              type: string
              enum: [accepted, missed_steer]
              description: Sends to finished children land as missed_steer, never relaunch.
    StreamEvent:
      type: object
      required: [seq, threadKey, type, at]
      properties:
        seq:
          type: integer
          description: Resume token; pass as lastSeq to reconnect without gap or duplex.
        threadKey:
          type: string
        type:
          type: string
          enum: [message, state, delta, reasoning, tool, finding, error, context-version, approval, work-progress, compaction, steering-consumption]
        at:
          type: string
          format: date-time
        payload:
          type: object
          description: ThreadMessage for message events, Thread for state events (overflow adds historyRefresh=true; reload bounded message pages before accepting its token); ephemeral provider text, reasoning, or tool status for delta, reasoning, or tool events.
      example:
        seq: 8
        threadKey: s-now
        type: message
        at: '2026-09-25T10:02:00Z'
