openapi: 3.1.0
info:
  version: 1.0.0
  title: Kardata Staging API
  description: |
    Versioned backend contract with StagingApi parity. Every envelope is
    `{ ok: true, data }` or `{ ok: false, error: { code, message } }`.
    Breaking changes require a new major version; additive changes stay on v1.
    Thread semantics follow documentation/frontend-thread-contract.md.
servers:
  - url: http://localhost:3001
tags:
  - name: sessions
  - name: threads
  - name: runs
  - name: commands
  - name: providers
  - name: mcp
  - name: ops
paths:
  /v1/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions, newest first.
      parameters:
        - name: sectorId
          in: query
          required: false
          description: Narrow to one sector's chats. Without it only general sessions list; sector chats never appear in Karbot.
          schema:
            type: string
      responses:
        '200':
          description: Session list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a session (starts its session thread).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                sectorId:
                  type: string
                  description: Link a sector chat; the sector must exist.
      responses:
        '201':
          description: Created session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '409':
          $ref: '#/components/responses/IdempotencyReplay'
  /v1/sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: One session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session (stops its workflow, appends a tombstone; reads hide it, history stays).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deleted session id.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    required: [id, deleted]
                    properties:
                      id:
                        type: string
                      deleted:
                        type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyReplay'
  /v1/sessions/{sessionId}/compact:
    post:
      operationId: compactSession
      tags: [sessions]
      summary: Compact durable working context; preserve the visible transcript and park on failure.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Compaction outcome.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    required: [sessionId, compacted, messageCount]
                    properties:
                      sessionId:
                        type: string
                      compacted:
                        type: boolean
                      messageCount:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{sessionId}/rename:
    post:
      operationId: renameSession
      tags: [sessions]
      summary: Rename a session (appends a rename event; reads resolve the latest title).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Renamed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyReplay'
  /v1/sessions/{sessionId}/model:
    patch:
      operationId: setSessionModel
      tags: [sessions]
      summary: Set the session provider+model (appends a model event; GET reads back the latest).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                provider:
                  type: string
                  enum: [meta]
                model:
                  type: string
                  minLength: 1
                reasoning:
                  type: boolean
                effort:
                  type: string
                  minLength: 1
                  description: Reasoning depth; must be listed in the model's efforts.
      responses:
        '200':
          description: Stored session model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionModelEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyReplay'
  /v1/providers:
    get:
      operationId: getProviders
      tags: [providers]
      summary: Provider catalog with reasoning flags and key-presence booleans only.
      responses:
        '200':
          description: Provider catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCatalog'
  /v1/sessions/{sessionId}/artifacts:
    post:
      operationId: createSessionArtifact
      tags: [artifacts]
      summary: Create and index a session file or report.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name:
                  type: string
                content:
                  type: string
                kind:
                  type: string
                  enum: [file, proposal, report]
                detail:
                  type: string
                reason:
                  type: string
                  enum: [subagent_output, user_upload, report, proposal]
      responses:
        '201':
          description: Created artifact summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSummary'
        '400':
          description: Invalid artifact input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: listSessionArtifacts
      tags: [artifacts]
      summary: Stored/indexed artifact metadata for the session scope.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Artifact metadata list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactList'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{sessionId}/threads:
    get:
      operationId: listThreads
      tags: [threads]
      summary: Session thread plus one thread per subagent.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Thread list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadList'
  /v1/threads/{threadKey}:
    get:
      operationId: getThread
      tags: [threads]
      summary: Thread with live steer availability and queue depth.
      parameters:
        - $ref: '#/components/parameters/ThreadKey'
      responses:
        '200':
          description: One thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/threads/{threadKey}/messages:
    get:
      operationId: listMessages
      tags: [threads]
      parameters:
        - $ref: '#/components/parameters/ThreadKey'
        - name: afterSeq
          in: query
          description: Return messages after this sequence number.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Message page, ascending by seq.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
  /v1/threads/{threadKey}/steering-receipts:
    get:
      operationId: listSteeringReceipts
      tags: [threads]
      description: Scoped durable consumed/missed instruction outcomes, including receipts skipped by stream overflow.
      parameters:
        - $ref: '#/components/parameters/ThreadKey'
        - name: afterId
          in: query
          schema: { type: string, maxLength: 255, default: '' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        '200':
          description: Ascending ID page, with null nextAfterId at the end.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    required: [items, nextAfterId]
                    properties:
                      nextAfterId: { type: [string, 'null'] }
                      items:
                        type: array
                        maxItems: 200
                        items:
                          type: object
                          required: [id, state]
                          properties:
                            id: { type: string }
                            state: { type: string, enum: [consumed, missed] }
  /v1/threads/{threadKey}/events:
    get:
      operationId: streamThread
      tags: [threads]
      summary: SSE stream of thread events with resume token.
      parameters:
        - $ref: '#/components/parameters/ThreadKey'
        - name: lastSeq
          in: query
          description: Resume token; replays missed events without gap or duplex.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: text/event-stream of StreamEvent frames.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
  /v1/alerts:
    get:
      operationId: listSupervisionAlerts
      tags: [ops]
      summary: Authenticated scoped durable supervision notices, never raw fleet payloads.
      parameters:
        - name: beforeSeq
          in: query
          schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Newest-first scoped notices with exclusive sequence pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionAlertEnvelope'
        '400':
          description: Invalid page parameters.
        '403':
          description: Missing, unknown or mismatched scoped credentials, including open app mode.
        '503':
          description: Database unavailable.
  /v1/runs:
    get:
      operationId: listRuns
      tags: [runs]
      parameters:
        - name: sessionId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Run list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
  /v1/runs/{runId}:
    get:
      operationId: getRun
      tags: [runs, ops]
      summary: Run detail with stage cursor, findings, and budget ratios.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: One run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/skills:
    get:
      operationId: listSkills
      tags: [ops]
      summary: Registered product skills for the chat slash picker.
      responses:
        '200':
          description: Skill catalogue.
          content:
            application/json:
              schema:
                type: object
  /v1/debug/runs/{runId}:
    get:
      operationId: inspectRun
      tags: [ops]
      summary: Read-only run inspector, events-only (never contacts Temporal).
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: afterSeq
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Event-derived run state with lastSeq/lastEventAt freshness.
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commands/send:
    post:
      operationId: sendMessage
      tags: [commands]
      summary: Send text to a thread. `@name` routes to that subagent thread.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCommand'
      responses:
        '202':
          description: Accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
  /v1/commands/steer:
    post:
      operationId: steerThread
      tags: [commands]
      summary: Steer sends instantly to the addressed thread, even mid-run.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SteerCommand'
      responses:
        '202':
          description: Accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
        '409':
          description: Thread not accepting steer; caller chooses re-queue or new launch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/commands/pause:
    post:
      operationId: pauseRun
      tags: [commands]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRef'
      responses:
        '202':
          description: Accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
  /v1/commands/resume:
    post:
      operationId: resumeRun
      tags: [commands]
      summary: Resume from the stage cursor. Never re-runs settled stages.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeCommand'
      responses:
        '202':
          description: Accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
        '403':
          $ref: '#/components/responses/Denied'
  /v1/commands/cancel:
    post:
      operationId: cancelRun
      tags: [commands]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRef'
      responses:
        '202':
          description: Accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
  /v1/commands/approve:
    post:
      operationId: decideApproval
      tags: [commands]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '202':
          description: Accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
        '403':
          $ref: '#/components/responses/Denied'
  /v1/sectors:
    get:
      operationId: listSectors
      tags: [sectors]
      summary: Sector researches with live company counts.
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [draft, planning, planned, approved, running, paused, queued, failed, complete]
        - name: query
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Sector list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorList'
        '400':
          description: Bad filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createSector
      tags: [sectors]
      summary: Create a sector draft (or queued); drafts start explicitly later.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 200
                topic:
                  type: string
                  maxLength: 500
                state:
                  type: string
                  enum: [draft, queued]
                  default: draft
      responses:
        '201':
          description: Created sector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorEnvelope'
        '400':
          description: Bad input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/sectors/{sectorId}:
    get:
      operationId: getSector
      tags: [sectors]
      summary: One sector with its companies and activity timeline.
      parameters:
        - $ref: '#/components/parameters/SectorId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Sector detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sectors/{sectorId}/start:
    post:
      operationId: startSector
      tags: [sectors]
      summary: 'Explicit start: an approved plan enters the research queue.'
      parameters:
        - $ref: '#/components/parameters/SectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Started sector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Sector is not a draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/sectors/{sectorId}/plan:
    post:
      operationId: planSector
      tags: [sectors]
      summary: 'Explicit plan: draft/failed enters planning with a visible planning chat.'
      parameters:
        - $ref: '#/components/parameters/SectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Planning sector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Sector is neither draft nor failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: readSectorPlan
      tags: [sectors]
      summary: Versioned research plan artifact (empty versions until planned).
      parameters:
        - $ref: '#/components/parameters/SectorId'
      responses:
        '200':
          description: Plan artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorPlan'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: editSectorPlan
      tags: [sectors]
      summary: 'Brainstorm edit: appends a plan version (re-opens review when approved).'
      parameters:
        - $ref: '#/components/parameters/SectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markdown]
              properties:
                markdown:
                  type: string
      responses:
        '200':
          description: New plan version.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: No plan to update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Sector is neither planned nor approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/sectors/{sectorId}/approve:
    post:
      operationId: approveSectorPlan
      tags: [sectors]
      summary: 'Owner approval: pins a plan version and moves planned to approved.'
      parameters:
        - $ref: '#/components/parameters/SectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  minimum: 1
                contextVersion:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Approved sector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Unknown plan version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Sector is not planned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/sectors/{sectorId}/documents:
    get:
      operationId: listSectorDocuments
      tags: [sectors]
      summary: Context documents attached to a sector.
      parameters:
        - $ref: '#/components/parameters/SectorId'
      responses:
        '200':
          description: Document list (metadata; text stays server-side for preload).
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: attachSectorDocument
      tags: [sectors]
      summary: Attach one context document (.md/.txt/.csv/.json/.pdf/.docx, base64).
      parameters:
        - $ref: '#/components/parameters/SectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentBase64]
              properties:
                filename:
                  type: string
                  maxLength: 255
                contentBase64:
                  type: string
                  maxLength: 12582912
      responses:
        '201':
          description: Current attached metadata. PDFs report durable processing progress and are not indexed until complete.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data: { $ref: '#/components/schemas/AttachedSectorDocument' }
        '400':
          description: Bad input or unsupported type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: PDF file-processing runner or archive unavailable before file/job publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/sectors/{sectorId}/context/compact:
    post:
      operationId: compactSectorContext
      tags: [sectors]
      summary: Consolidate multiple context notes into one summary; fewer than two notes is an honest no-op.
      parameters:
        - $ref: '#/components/parameters/SectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Compaction outcome.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    required: [sectorId, compacted, beforeCount, afterCount]
                    properties:
                      sectorId:
                        type: string
                      compacted:
                        type: boolean
                      beforeCount:
                        type: integer
