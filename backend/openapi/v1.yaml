      summary: MCP Streamable HTTP endpoint (JSON-RPC over POST, JSON responses).
      description: Execution bindings and grants are checked before replay. Reads are fresh. Mutations use semantic input and authority identity; RPC response IDs follow each retry. Proven pre-effect failures may retry; uncertain mutation outcomes retain their guards.
