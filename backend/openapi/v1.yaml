        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpRequest'
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpResponse'
        '403':
          $ref: '#/components/responses/Denied'
        '409':
          $ref: '#/components/responses/IdempotencyReplay'
        '500':
          description: Handler or completion-store failure; an uncertain guarded mutation must not be blindly repeated.
          headers:
            x-kardata-operation-state:
              schema: { type: string, enum: [uncertain] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
