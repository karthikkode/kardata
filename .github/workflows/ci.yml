# CI verify pipeline (no deploy target: this workflow proves, never ships).
# Deterministic verification plus isolated Postgres/Temporal integration.
# Paid provider, full stress, ui-review grading and live UI pilot evidence
# remain local release gates.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm test -w @kardata/backend -- pdf-mixed.test.ts
        env:
          KARDATA_PDF_MEMORY_TEST: '1'
      - name: No test rewrote tracked files
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-memory-review
          path: backend/test-results/pdf-decoded-memory*.json

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Sequential: the suite's perf budgets (200ms longtask cap,
      # 1000-row paging inside 30s) are validated on an unloaded
      # machine; parallel workers on shared runners break them with
      # load noise, not product regressions (PR #37 triage).
      - run: npm run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: frontend/test-results/

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: kardata
          POSTGRES_PASSWORD: kardata-ci
          POSTGRES_DB: kardata_test
        ports: ['5432:5432']
        options: --shm-size=1g --health-cmd "pg_isready -U kardata" --health-interval 5s --health-timeout 3s --health-retries 12
      temporal:
        image: temporalio/auto-setup@sha256:b1edc1e20002d958c8182f2ae08dee877a125083683a627a44917683419ba6a8
        env:
          DB: postgres12_pgx
          DB_PORT: '5432'
          POSTGRES_USER: kardata
          POSTGRES_PWD: kardata-ci
          POSTGRES_SEEDS: postgres
        ports: ['7233:7233']
        options: --health-cmd "temporal operator cluster health --address `hostname -i`:7233" --health-interval 10s --health-timeout 5s --health-retries 18
    env:
      TEST_DATABASE_URL: postgresql://kardata:kardata-ci@localhost:5432/kardata_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @kardata/agents
      - run: npm run build -w @kardata/backend
      - run: npm test -w @kardata/backend
      - run: npm test -w @kardata/backend -- workflows.run.test.ts workflows.subagents.test.ts workflows.plan.test.ts workflows.coordinator.test.ts workflows.file-processing.test.ts
        env:
          KARDATA_TEMPORAL_TEST: '1'
          KARDATA_FILE_TEMPORAL_ADDRESS: localhost:7233
      # Fault drills F6-F8 need a Toxiproxy server: same image and host
      # networking as `stack:toxi up`, so proxy ports behave identically.
      - name: Start toxiproxy
        run: |
          docker run -d --name kardata-toxiproxy --network host shopify/toxiproxy:latest
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8474/version && break || sleep 1; done
      - run: npm run test:fault
        env:
          TOXIPROXY_URL: http://127.0.0.1:8474
          KARDATA_FILE_TEMPORAL_ADDRESS: localhost:7233
      - run: npm run test:stress
        env:
          KARDATA_STRESS: '1'
          KARDATA_STRESS_SCALE: reduced
      - run: node scripts/coverage.mjs --backend-only
        env:
          KARDATA_FILE_TEMPORAL_ADDRESS: localhost:7233

      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx tsc --noEmit --strict --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext --types node tests/frontend-e2e/files-db.spec.ts
      - run: npm run test:e2e -w frontend -- files-db.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-files-integration
          path: frontend/test-results/

      - run: npx tsc --noEmit --strict --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext --types node tests/frontend-e2e/agent-context-db.spec.ts
      - run: npm run test:e2e -w frontend -- agent-context-db.spec.ts
        env:
          KARDATA_TEMPORAL_TEST: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-agent-context-integration
          path: frontend/test-results/
      - name: No test rewrote tracked files
        run: git diff --exit-code
